<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>

<div class="wrap">
  <header>
    <h1>Delamain Neon City</h1>
    <div class="note">Прототип. Рейсы идут по настоящему журналу за 5 дней.</div>

  <div class="stage"><aside id="roster" hidden></aside><div id="tip" hidden></div><canvas id="c" width="1800" height="780" aria-label="Ночной город: машинки летают между зданиями, районы оживают от событий журнала"></canvas></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="deck">
    <div class="group"><button id="play" aria-pressed="true">Пауза</button><button id="burst">Показать всплеск</button><button id="quiet">Тихий город</button></div>
    <div class="group" id="speeds"><span class="lab">час журнала за</span><button data-s="3600">1 с</button><button data-s="1200">3 с</button><button data-s="300">12 с</button></div>
    <div class="read"><span id="clock">—</span><span>событий <b id="n">0</b></span><span>районов горит <b id="lit">0</b></span></div>
  </div>
  <div class="legend" id="legend"></div>
</div>
